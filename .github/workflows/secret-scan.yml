name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source=. --config=.gitleaks.toml --redact 2>&1

  gitleaks-negative-test:
    name: Secret scan negative test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Create planted secret and verify detection
        run: |
          mkdir -p /tmp/negative-test
          echo 'GITHUB_TOKEN=ghp_aBcDeFgHiJkLmNoPqRsTuVwXyZ1234567890ab' > /tmp/negative-test/planted.env
          if gitleaks detect --source=/tmp/negative-test --no-git 2>&1; then
            echo "NEGATIVE TEST FAILED: gitleaks did not detect the planted secret."
            exit 1
          else
            echo "NEGATIVE TEST PASSED: gitleaks correctly detected the planted secret."
          fi
