name: test

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

jobs:
  terratest:
    name: Terratest unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.3"

      - name: Verify OpenTofu
        run: tofu version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Go dependencies
        working-directory: tests
        run: go mod tidy

      - name: Run Terratest
        working-directory: tests
        run: go test -v -timeout 10m ./... 2>&1 | tee test_output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terratest-output
          path: tests/test_output.txt
          retention-days: 30
